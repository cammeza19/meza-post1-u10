# =====================================================================
# sonar-project.properties — envios-service (Post-contenido Unidad 10)
# ---------------------------------------------------------------------
# NOTA: al analizar con "mvn sonar:sonar", el scanner de Maven NO lee
# este archivo; toma las propiedades equivalentes declaradas en
# <properties> del pom.xml. Este archivo se conserva porque la guía lo
# exige y porque es el que usa el scanner standalone (sonar-scanner).
# =====================================================================

# --- Identificación del proyecto en SonarQube (Paso 1) ---
# Clave única del proyecto: groupId:artifactId del pom.xml
sonar.projectKey=com.universidad:envios-service
# Nombre visible en el dashboard
sonar.projectName=Envios Service
sonar.projectVersion=1.0

# --- Código a analizar ---
# Código de producción: ServicioCalculoEnvio (service) y las estrategias (estrategia)
sonar.sources=src/main/java
# Pruebas: se analizan como código de test y no cuentan como líneas a cubrir
sonar.tests=src/test/java
# Bytecode compilado, requerido por el analizador Java (ejecutar antes mvn clean verify)
sonar.java.binaries=target/classes

# --- Cobertura (Paso 3) ---
# Reporte XML generado por jacoco-maven-plugin (goal report) en mvn clean verify
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# --- Exclusiones (Decisión de diseño 2) ---
# No se excluye ninguna clase: el proyecto no tiene clase Main, DTOs ni
# configuración sin lógica que distorsione la cobertura. Si se agregara
# una clase de arranque, se excluiría así:
# sonar.exclusions=**/EnviosServiceApplication.java

# --- Servidor (Decisión de diseño 1: SonarQube local en Docker) ---
sonar.host.url=http://localhost:9000
# No bloquear el build esperando el resultado del Quality Gate;
# el resultado se revisa en el dashboard y se documenta en el README
sonar.qualitygate.wait=false
